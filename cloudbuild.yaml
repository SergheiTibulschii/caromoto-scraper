steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - '--no-cache'
      - '-t'
      - >-
        $_AR_HOSTNAME/$_AR_PROJECT_ID/$_AR_REPOSITORY/$REPO_NAME/$_SERVICE_NAME:$COMMIT_SHA
      - .
      - '-f'
      - Dockerfile
    id: Build
  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - >-
        $_AR_HOSTNAME/$_AR_PROJECT_ID/$_AR_REPOSITORY/$REPO_NAME/$_SERVICE_NAME:$COMMIT_SHA
    id: Push
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    args:
      - run
      - services
      - update
      - $_SERVICE_NAME
      - '--platform=managed'
      - >-
        --image=$_AR_HOSTNAME/$_AR_PROJECT_ID/$_AR_REPOSITORY/$REPO_NAME/$_SERVICE_NAME:$COMMIT_SHA
      - >-
        --labels=managed-by=gcp-cloud-build-deploy-cloud-run,commit-sha=$COMMIT_SHA,gcb-build-id=$BUILD_ID,gcb-trigger-id=$_TRIGGER_ID
      - '--region=$_DEPLOY_REGION'
      - '--memory=2Gi'
      - '--cpu=2'
      - '--timeout=3600'
      - '--max-instances=1'
      - '--min-instances=1'
      - '--set-env-vars'
      - >-
        NODE_ENV=production,PLAYWRIGHT_HEADLESS=true,REDIS_PORT=6379,REDIS_DB=0,REDIS_KEY_PREFIX=caromoto:,REDIS_ENABLE_PERSISTENCE=true,REDIS_MAX_RETRIES=5,REDIS_RETRY_DELAY=2000,SCHEDULER_ENABLED=true,SCRAPER_CRON_SCHEDULE=*/5 * * * *,SCHEDULER_TIMEZONE=Europe/Chisinau,SCRAPER_RUN_ON_START=true,PLAYWRIGHT_BROWSER=chromium,PLAYWRIGHT_TIMEOUT=30000,PLAYWRIGHT_NAVIGATION_TIMEOUT=60000,PLAYWRIGHT_VIEWPORT_WIDTH=1920,PLAYWRIGHT_VIEWPORT_HEIGHT=1080,PLAYWRIGHT_MAX_CONCURRENT_PAGES=3,PLAYWRIGHT_STEALTH_MODE=true,PLAYWRIGHT_PROXY_SERVER=,PLAYWRIGHT_PROXY_USERNAME=,PLAYWRIGHT_PROXY_PASSWORD=
      - '--set-secrets'
      - >-
        REDIS_HOST=redis-host:latest,REDIS_PASSWORD=redis-password:latest,CAROMOTO_EMAIL=caromoto-email:latest,CAROMOTO_PASSWORD=caromoto-password:latest,TELEGRAM_BOT_TOKEN=telegram-bot-token:latest,TELEGRAM_CHAT_ID=telegram-chat-id:latest
      - '--quiet'
    id: Deploy
    entrypoint: gcloud
images:
  - >-
    $_AR_HOSTNAME/$_AR_PROJECT_ID/$_AR_REPOSITORY/$REPO_NAME/$_SERVICE_NAME:$COMMIT_SHA
options:
  substitutionOption: ALLOW_LOOSE
  logging: CLOUD_LOGGING_ONLY
substitutions:
  _AR_HOSTNAME: europe-west1-docker.pkg.dev
  _AR_REPOSITORY: cloud-run-source-deploy
  _AR_PROJECT_ID: caromoto-scraper
  _PLATFORM: managed
  _SERVICE_NAME: caromoto-scraper
  _DEPLOY_REGION: europe-west1
  _TRIGGER_ID: 3e120626-98b9-499d-ac1d-f14e3ea0a50c
tags:
  - gcp-cloud-build-deploy-cloud-run
  - gcp-cloud-build-deploy-cloud-run-managed
  - caromoto-scraper
