# Redis configuration for Caromoto Scraper
# Persistence configuration for crash recovery

# RDB Snapshots (point-in-time backups)
# Save after 900 seconds (15 min) if at least 1 key changed
save 900 1
# Save after 300 seconds (5 min) if at least 10 keys changed
save 300 10
# Save after 60 seconds if at least 10000 keys changed
save 60 10000

# RDB filename
dbfilename dump.rdb

# Working directory for RDB and AOF files
dir /data

# AOF (Append Only File) for durability
appendonly yes
appendfilename "appendonly.aof"

# AOF fsync policy (everysec is good balance between performance and durability)
appendfsync everysec

# AOF rewrite configuration
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

# Enable RDB-AOF hybrid persistence (Redis 4.0+)
aof-use-rdb-preamble yes

# Memory management
maxmemory 256mb
maxmemory-policy allkeys-lru

# Logging
loglevel notice

# Network
bind 0.0.0.0
protected-mode no
port 6379

# Performance
tcp-backlog 511
timeout 0
tcp-keepalive 300
